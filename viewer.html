<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Leylines Cosmos</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.135/Build/Cesium/Cesium.js"></script>
  <link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.135/Build/Cesium/Widgets/widgets.css">
  <style>
    html, body, #cesium { width:100%; height:100%; margin:0; overflow:hidden; }
    form { position:absolute; top:8px; left:8px; padding:10px; background:#fff; z-index:1; font:14px sans-serif; }
    #status { display:block; max-width:650px; }
  </style>
</head>
<body>
<div id="cesium"></div>
<form id="controls">
  <input id="date" type="date" value="1979-11-05" required aria-label="Datum (plus je eine Stunde Puffer)">
  <select id="skyculture" aria-label="Himmelskultur">
    <option value="modern_st">Modern (S&amp;T)</option>
    <option value="egyptian_dendera">Ägyptisch – Dendera</option>
    <option value="babylonian_mulapin">Babylonisch – MUL.APIN</option>
    <option value="navajo">Navajo</option>
    <option value="chinese">Chinesisch (HIP-Teilmenge)</option>
  </select>
  <label><input id="terrain" type="checkbox"> Re:Earth-Terrain</label>
  <button>Laden (gregorianisch)</button>
  <span id="status">Natural Earth II · WGS84. Re:Earth-Terrain bei Bedarf einschalten – kein Token nötig.</span>
</form>
<script>
const viewer = new Cesium.Viewer('cesium', {
  baseLayer: Cesium.ImageryLayer.fromProviderAsync(
    Cesium.TileMapServiceImageryProvider.fromUrl(
      Cesium.buildModuleUrl('Assets/Textures/NaturalEarthII')
    )
  ),
  baseLayerPicker: false, geocoder: false,
  terrainProvider: new Cesium.EllipsoidTerrainProvider(), shouldAnimate: false
});
viewer.scene.globe.baseColor = Cesium.Color.DARKSLATEGRAY;
viewer.scene.globe.depthTestAgainstTerrain = true;
const status = document.getElementById('status');
const terrainToggle = document.getElementById('terrain');
const loadButton = document.querySelector('#controls button');
let terrainPromise;
let currentSource;
let currentWarnings;
let originalGroundPositions = new Map();

function showStatus() {
  status.textContent = terrainToggle.checked
    ? 'Natural Earth II · Re:Earth-Terrain aktiv. Für genaue Terrain-Pins Zeit pausieren.'
    : 'Natural Earth II · WGS84 aktiv. Tierkreis-Sternbilder: Gold; übrige Sternbilder: Blau.';
  if (currentWarnings) status.textContent += ' Hinweis: ' + currentWarnings;
}

async function setTerrain(enabled) {
  let provider = new Cesium.EllipsoidTerrainProvider();
  if (enabled) {
    if (!terrainPromise) {
      terrainPromise = Cesium.CesiumTerrainProvider.fromUrl(
        'https://terrain.reearth.land/cesium-mesh/ellipsoid',
        { requestVertexNormals: true, requestWaterMask: true }
      ).catch(error => { terrainPromise = undefined; throw error; });
    }
    provider = await terrainPromise;
  }
  if (detachTerrain) { detachTerrain(); detachTerrain = undefined; }
  viewer.terrainProvider = provider;
  if (currentSource) {
    // Restore sampled positions before installing callbacks for the new mode.
    for (const [ground, position] of originalGroundPositions) {
      ground.position = position;
      const bodyId = ground.properties.pinBody.getValue();
      currentSource.entities.getById(bodyId + '_pin').polyline.show = true;
    }
    if (enabled) detachTerrain = attachTerrainPins(currentSource, provider);
    else attachEllipsoidPins(currentSource);
  }
  viewer.scene.requestRender();
}

terrainToggle.addEventListener('change', async () => {
  terrainToggle.disabled = true;
  loadButton.disabled = true;
  status.textContent = 'Terrain wird umgeschaltet …';
  try {
    await setTerrain(terrainToggle.checked);
    showStatus();
  } catch (error) {
    terrainToggle.checked = false;
    await setTerrain(false);
    status.textContent = 'Re:Earth konnte nicht geladen werden; WGS84 aktiv. ' + error.message;
  } finally { terrainToggle.disabled = false; loadButton.disabled = false; }
});

function attachEllipsoidPins(source) {
  for (const ground of source.entities.values.filter(e => e.properties?.pinBody)) {
    const body = source.entities.getById(ground.properties.pinBody.getValue());
    ground.position = new Cesium.CallbackPositionProperty((time, result) => {
      const xyz = body.position.getValue(time);
      return xyz ? Cesium.Ellipsoid.WGS84.scaleToGeocentricSurface(xyz, result) : undefined;
    }, false, Cesium.ReferenceFrame.FIXED);
  }
}

// Fetch the terrain height at the CURRENT simulation position, not a screen pick.
// While a height query is pending, hide the pin rather than display a stale tip.
// Quantisation to milliseconds only coalesces identical rendered timestamps.
function attachTerrainPins(source, provider) {
  let disposed = false;
  let generation = 0;
  let lastKey;
  let pending = false;
  const pins = source.entities.values.filter(e => e.properties?.pinBody).map(ground => {
    const bodyId = ground.properties.pinBody.getValue();
    const pin = source.entities.getById(bodyId + '_pin');
    const basePosition = ground.position;
    const state = { ground, pin, basePosition, tip: undefined, key: undefined };
    ground.position = new Cesium.CallbackPositionProperty((time, result) => {
      const key = Cesium.JulianDate.toIso8601(time, 3);
      return state.key === key && state.tip ? Cesium.Cartesian3.clone(state.tip, result) : undefined;
    }, false, Cesium.ReferenceFrame.FIXED);
    pin.polyline.show = new Cesium.CallbackProperty(time =>
      state.key === Cesium.JulianDate.toIso8601(time, 3) && !!state.tip, false);
    return state;
  });
  const removeTick = viewer.clock.onTick.addEventListener(async clock => {
    const time = Cesium.JulianDate.clone(clock.currentTime);
    const key = Cesium.JulianDate.toIso8601(time, 3);
    if (pending || key === lastKey) return;
    pending = true;
    const currentGeneration = ++generation;
    const active = pins.map(state => ({state, xyz:state.basePosition.getValue(time)})).filter(p => p.xyz);
    try {
      const positions = active.map(p => Cesium.Cartographic.fromCartesian(p.xyz));
      const sampled = await Cesium.sampleTerrainMostDetailed(provider, positions);
      if (disposed || currentGeneration !== generation) return;
      active.forEach(({state}, i) => {
        const point = sampled[i];
        state.tip = Number.isFinite(point.height) ? Cesium.Cartesian3.fromRadians(
          point.longitude, point.latitude, point.height) : undefined;
        state.key = key;
      });
      lastKey = key;
      viewer.scene.requestRender();
    } catch (error) {
      if (!disposed) status.textContent = 'Terrain-Abfrage fehlgeschlagen: ' + error.message;
    } finally { pending = false; }
  });
  return () => { disposed = true; removeTick(); };
}

let detachTerrain;
document.getElementById('controls').addEventListener('submit', async event => {
  event.preventDefault();
  const button = event.submitter;
  button.disabled = true;
  terrainToggle.disabled = true;
  viewer.clock.shouldAnimate = false;
  try {
    status.textContent = 'Berechne CZML …';
    const date = document.getElementById('date').value;
    const culture = document.getElementById('skyculture').value;
    const response = await fetch(`/api/${date}/gregorian?skyculture=${encodeURIComponent(culture)}`);
    if (!response.ok) throw new Error(await response.text());
    const packets = await response.json();
    const source = await Cesium.CzmlDataSource.load(packets);
    if (detachTerrain) { detachTerrain(); detachTerrain = undefined; }
    viewer.dataSources.removeAll(true);
    await viewer.dataSources.add(source);
    currentSource = source;
    currentWarnings = packets[0].properties?.warnings;
    originalGroundPositions = new Map(source.entities.values
      .filter(entity => entity.properties?.pinBody).map(entity => [entity, entity.position]));
    try {
      await setTerrain(terrainToggle.checked);
      showStatus();
    } catch (error) {
      terrainToggle.checked = false;
      await setTerrain(false);
      status.textContent = 'Re:Earth konnte nicht geladen werden; WGS84 aktiv. ' + error.message;
    }
  } catch (error) { status.textContent = error.message; }
  finally { button.disabled = false; terrainToggle.disabled = false; }
});
</script>
</body>
</html>
